name: Build CloudStream Extension

# Real Gradle build of the CloudStream plugin (.cs3).
# The built plugin is committed to build/outputs/ on main so that
# repo.json's apkUrl (raw.githubusercontent) always serves a real file.

concurrency:
  group: "build-extension"
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-extension.yml'

jobs:
  build:
    # Skip the auto-commit of the built plugin itself (avoids build loop)
    if: "!contains(github.event.head_commit.message, 'Build plugin')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build plugin (.cs3)
        run: gradle :extension:make --no-daemon
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Verify plugin compatibility
        run: gradle :extension:ensureJarCompatibility --no-daemon
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Collect built plugin
        run: |
          mkdir -p build/outputs
          cp extension/build/*.cs3 build/outputs/CloudControlProvider.cs3
          ls -la build/outputs/
          file build/outputs/CloudControlProvider.cs3

      - name: Commit built plugin to main
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add build/outputs/CloudControlProvider.cs3
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Build plugin $GITHUB_SHA"
          git push
          
