name: Auto Sync Phisher Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Current System Architecture
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Clone Remote Phisher Source
        run: |
          git clone https://github.com/phisher98/cloudstream-extensions-phisher.git /tmp/phisher-source

      - name: Execute Rsync (Safe Data Injection)
        run: |
          rsync -av --ignore-existing \
                    --exclude='.git' \
                    --exclude='.github' \
                    --exclude='build.gradle.kts' \
                    --exclude='settings.gradle.kts' \
                    --exclude='README.md' \
                    --exclude='.gitignore' \
                    /tmp/phisher-source/ ./

      - name: Commit & Push Modular Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat(auto-sync): inject all phisher providers without overriding existing code"
          branch: main
          file_pattern: '.'
          
